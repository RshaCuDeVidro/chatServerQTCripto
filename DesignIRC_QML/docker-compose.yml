
services:
  backend:
    build: ./backend
    container_name: chat_backend
    ports:
      - "8765:8765"
    depends_on:
      - postgres
      - valkey
    environment:
      - DATABASE_URL=postgresql://chat_user:${DB_PASSWORD:-chat_pass}@postgres:5432/chat_db
      - VALKEY_URL=redis://:${VALKEY_PASSWORD}@valkey:6379
      - HOST=0.0.0.0
      - PORT=8765
    volumes:
      - ./backend:/app
    restart: unless-stopped
    networks:
      - chat_network

  postgres:
    image: postgres:18-alpine
    container_name: chat_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=chat_db
      - POSTGRES_USER=chat_user
      - POSTGRES_PASSWORD=${DB_PASSWORD:-chat_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - chat_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_user -d chat_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:latest
    container_name: chat_valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: valkey-server --appendonly yes --requirepass ${VALKEY_PASSWORD:-}
    restart: unless-stopped
    networks:
      - chat_network
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Opcional: pgAdmin para gerenciar PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: chat_pgadmin
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - chat_network

networks:
  chat_network:
    driver: bridge

volumes:
  postgres_data:
  valkey_data:
  pgadmin_data:
